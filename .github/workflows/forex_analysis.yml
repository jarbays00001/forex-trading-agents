name: Forex Analysis

on:
  schedule:
    - cron: '0 8 * * 1-5' # Setiap hari kerja jam 08:00 UTC (15:00 WIB)
  workflow_dispatch: # Memungkinkan menjalankan manual dari tab Actions

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install .
          # Instal library untuk membuat grafik beserta dependensinya (six)
          pip install yfinance mplfinance pandas six

      - name: Run TradingAgents Analysis
        env:
          TRADINGAGENTS_LLM_PROVIDER: google
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.1-flash-lite
          TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.1-flash-lite
          TRADINGAGENTS_OUTPUT_LANGUAGE: "English"
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
        run: |
          tradingagents --ticker "EURUSD=X" --date $(date +'%Y-%m-%d') --analysts market --save --no-show

      - name: Extract, Validate & Create Summary
        run: |
          python3 -c "
          import re, glob, os
          
          list_of_files = glob.glob('/home/runner/.tradingagents/logs/reports/*/complete_report.md')
          if not list_of_files:
              print('Laporan tidak ditemukan.')
              exit(0)
          
          latest_file = max(list_of_files, key=os.path.getctime)
          with open(latest_file, 'r') as f:
              content = f.read()
          
          rating_match = re.search(r'(?i)\*\*Rating\*\*:\s*([A-Za-z]+)', content)
          if not rating_match:
              rating_match = re.search(r'(?i)FINAL TRANSACTION PROPOSAL:\s*\*\*([A-Za-z]+)\*\*', content)
          signal = rating_match.group(1).upper() if rating_match else 'N/A'

          entry_str = re.search(r'[Ee]ntry(?:[^\d]*)([1-9]\d*[.,]\d+)', content)
          sl_str = re.search(r'[Ss]top[- ]?[Ll]oss(?:[^\d]*)([1-9]\d*[.,]\d+)', content)
          tp_str = re.search(r'[Tt]ake[- ]?[Pp]rofit(?:[^\d]*)([1-9]\d*[.,]\d+)', content)
          atr_str = re.search(r'(?i)ATR[^\d]*([0-9][.,]\d+)', content)

          try:
              entry = float(entry_str.group(1).replace(',', '.')) if entry_str else 0.0
              sl = float(sl_str.group(1).replace(',', '.')) if sl_str else 0.0
              tp = float(tp_str.group(1).replace(',', '.')) if tp_str else 0.0
              atr = float(atr_str.group(1).replace(',', '.')) if atr_str else 0.0050
              
              if entry > 0 and len(str(entry).split('.')[-1]) < 4:
                  entry = round(entry, 5)
                  
              if signal == 'SELL':
                  if sl <= entry: sl = round(entry + (1.5 * atr), 5)
                  if tp >= entry: tp = round(entry - (2.0 * atr), 5)
              elif signal == 'BUY':
                  if sl >= entry: sl = round(entry - (1.5 * atr), 5)
                  if tp <= entry: tp = round(entry + (2.0 * atr), 5)
                  
              f_entry = f'{entry:.5f}'
              f_sl = f'{sl:.5f}'
              f_tp = f'{tp:.5f}'
          except Exception as e:
              f_entry, f_sl, f_tp = '0.00000', '0.00000', '0.00000'
              print(f'Error parsing: {e}')

          summary = '## Ringkasan Eksekusi Forex\n\n'
          summary += f'- **Action**: {signal}\n'
          summary += f'- **Entry**: {f_entry}\n'
          summary += f'- **Stop Loss**: {f_sl}\n'
          summary += f'- **Take Profit**: {f_tp}\n'
          
          print(summary)
          
          with open('RINGKASAN_TRADING.md', 'w') as f:
              f.write(summary)
              
          # SIMPAN NILAI KE ENVIRONMENT GITHUB UNTUK DIGUNAKAN LANGKAH SELANJUTNYA
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'TRADE_ENTRY={f_entry}\n')
              env_file.write(f'TRADE_SL={f_sl}\n')
              env_file.write(f'TRADE_TP={f_tp}\n')
              env_file.write(f'TRADE_SIGNAL={signal}\n')
          "

      - name: Generate Chart
        run: |
          # Memanggil skrip pembuat chart dengan nilai dari langkah sebelumnya
          python3 chart_generator.py "EURUSD=X" $TRADE_ENTRY $TRADE_SL $TRADE_TP $TRADE_SIGNAL

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT=$(cat RINGKASAN_TRADING.md)
          
          # 1. Kirim pesan teks
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${TEXT}" \
            -d parse_mode="Markdown"
            
          # 2. Kirim gambar grafik (jika berhasil dibuat)
          if [ -f trade_chart.png ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F photo=@trade_chart.png
          fi
      
      - name: Upload Summary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-summary
          path: |
            RINGKASAN_TRADING.md
            trade_chart.png
